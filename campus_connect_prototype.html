<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101418">
<title>Campus Connect — Student community</title>
<style>
:root{--bg:#0d1115;--panel:#151b21;--panel2:#1b232b;--line:#29323b;--text:#f3f6f8;--muted:#9ba7b2;--gold:#f4c542;--green:#62d6a5;--blue:#78bfff;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{max-width:1160px;margin:auto;min-height:100vh;display:grid;grid-template-columns:250px 1fr}
.sidebar{border-right:1px solid var(--line);padding:24px 16px;background:#10151a;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 14px}.logo{height:42px;width:42px;border-radius:14px;background:var(--gold);color:#1a1a16;display:grid;place-items:center;font-size:22px;font-weight:900}.brand strong{font-size:18px;letter-spacing:-.4px}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.navlabel{font-size:10px;letter-spacing:1.6px;color:#74808b;font-weight:800;padding:0 12px;margin-bottom:-12px}
.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aeb8c2;text-align:left;padding:12px;border-radius:12px;display:flex;align-items:center;gap:12px;font-weight:650}.nav button:hover{background:#1a2229;color:white}.nav button.active{background:#292a20;color:#ffe58a}.nav .ico{width:23px;text-align:center;font-size:18px}.nav .count{margin-left:auto;background:#3b3320;color:#ffe58a;border-radius:20px;padding:2px 7px;font-size:11px}
.profilebox{margin-top:auto;padding:12px;border:1px solid var(--line);background:#151b20;border-radius:16px;display:flex;align-items:center;gap:10px}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex-shrink:0;color:#101418;background:#e7b8a3}.avatar.gold{background:#e8c45b}.avatar.blue{background:#9bc9ec}.avatar.green{background:#85d7b1}.avatar.pink{background:#d9a7d0}.avatar.purple{background:#b8a4ec}.profilebox small{display:block;color:var(--muted);font-size:12px}.profilebox button{margin-left:auto;border:0;background:none;color:var(--muted)}
.main{min-width:0}.topbar{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:14px}.crumb{color:var(--muted);font-size:13px}.top-actions{display:flex;align-items:center;gap:10px}.search{background:#171e24;border:1px solid var(--line);border-radius:12px;padding:10px 13px;color:white;width:min(250px,32vw);outline:none}.search:focus,input:focus,textarea:focus{border-color:#a99a4e!important;box-shadow:0 0 0 3px #f4c54216}
.iconbtn,.secondary,.primary{border-radius:11px;padding:10px 13px;border:1px solid var(--line);background:#1a2229;color:var(--text);font-weight:700}.primary{background:var(--gold);color:#1d1a0e;border-color:var(--gold)}.primary:hover{background:#ffda63}.secondary:hover,.iconbtn:hover{background:#25303a}
.content{padding:30px;max-width:1000px;margin:auto}.welcome{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:25px}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:1.6px;font-weight:850;text-transform:uppercase}.welcome h1{font-size:clamp(26px,4vw,36px);letter-spacing:-1.1px;margin:7px 0 5px}.welcome p{margin:0;color:var(--muted)}.datepill{border:1px solid var(--line);border-radius:99px;padding:9px 13px;color:var(--muted);white-space:nowrap;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:25px}.stat{background:linear-gradient(145deg,#1a2229,#141a20);border:1px solid var(--line);border-radius:16px;padding:17px}.stat .label{color:var(--muted);font-size:12px}.stat strong{font-size:26px;display:block;margin:7px 0 2px}.stat small{color:var(--green);font-size:11px}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:27px 0 13px}.sectionhead h2{font-size:17px;margin:0;letter-spacing:-.3px}.sectionhead span{color:var(--muted);font-size:12px}
.roomgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.room{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--panel);display:flex;gap:13px;align-items:flex-start;transition:.18s}.room:hover,.person:hover,.file:hover{transform:translateY(-2px);border-color:#46515c}.roomicon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex-shrink:0}.room h3{font-size:14px;margin:2px 0 4px}.room p{color:var(--muted);font-size:12px;margin:0 0 10px}.roomfoot{display:flex;align-items:center;gap:8px;color:#8995a0;font-size:11px}.dot{width:6px;height:6px;background:var(--green);border-radius:50%;display:inline-block}.room button{margin-left:auto;align-self:center;border:0;background:transparent;color:var(--muted);font-size:20px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.quick button{border:1px solid var(--line);background:#151b21;border-radius:14px;padding:15px;text-align:left;color:var(--text)}.quick button b{display:block;margin:6px 0 2px}.quick button small{color:var(--muted)}.quick .qico{font-size:20px}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.pagehead h1{margin:0 0 4px;font-size:28px;letter-spacing:-.8px}.pagehead p{margin:0;color:var(--muted)}.list{display:grid;gap:10px}.person,.file,.chatrow{border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:14px;display:flex;align-items:center;gap:13px;transition:.18s}.person .details,.file .details,.chatrow .details{min-width:0;flex:1}.details strong{display:block;font-size:14px}.details small{display:block;color:var(--muted);font-size:12px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tag{display:inline-block;border-radius:99px;background:#24352e;color:#8ee3bb;font-size:10px;padding:4px 8px;margin-top:7px}.chatlayout{display:grid;grid-template-columns:290px minmax(0,1fr);border:1px solid var(--line);border-radius:17px;overflow:hidden;min-height:510px}.chatlist{background:#12181e;border-right:1px solid var(--line);padding:13px}.chatlist h3{font-size:13px;margin:7px 8px 12px}.chatrow{padding:11px;margin-bottom:8px;border-radius:12px;cursor:pointer}.chatrow.selected{background:#28291f;border-color:#62572a}.chatrow .avatar{width:38px;height:38px}.chatrow .time{font-size:10px;color:var(--muted);align-self:flex-start}.chatpane{display:flex;flex-direction:column;min-width:0;background:#10161b}.chathead{display:flex;align-items:center;gap:11px;padding:14px 17px;border-bottom:1px solid var(--line)}.chathead .details small{color:var(--green)}.messages{padding:18px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:300px;max-height:440px;overflow:auto;background:radial-gradient(ellipse at top right,#18211f 0%,transparent 50%)}.empty{margin:auto;text-align:center;color:var(--muted);max-width:260px}.empty .big{font-size:35px;margin-bottom:8px}.bubble{max-width:80%;padding:10px 13px;border-radius:14px;background:#202a32;align-self:flex-start;overflow-wrap:anywhere}.bubble.mine{background:#645522;color:#fff6d6;align-self:flex-end;border-bottom-right-radius:4px}.bubble small{display:block;font-size:10px;opacity:.65;margin-top:5px;text-align:right}.composer{padding:12px;border-top:1px solid var(--line);display:flex;gap:9px}.composer input{flex:1;min-width:0;background:#1a2229;border:1px solid var(--line);border-radius:12px;padding:12px;color:white;outline:none}.notice{border:1px solid #66582a;background:#272416;color:#f5df8d;border-radius:12px;padding:12px 14px;font-size:12px;margin-bottom:18px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.filters button{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 12px;border-radius:99px;font-size:12px}.filters button.active{background:#302d1e;color:#ffe58a;border-color:#64572a}.fileicon{width:44px;height:48px;border-radius:10px;background:#263448;display:grid;place-items:center;font-size:20px}.emptylist{text-align:center;padding:50px 20px;border:1px dashed #36414b;border-radius:16px;color:var(--muted)}.emptylist strong{display:block;color:var(--text);margin:10px}
.modalback{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modalback.show{display:flex}.modal{width:min(470px,100%);background:#171e24;border:1px solid #36414b;border-radius:20px;padding:22px;box-shadow:0 25px 80px #0009}.modal h2{margin:0 0 5px}.modal p{color:var(--muted);font-size:13px;margin:0 0 17px}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:12px;color:#b8c2cb}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#0f151a;color:white;border-radius:11px;padding:11px;outline:none}.field textarea{min-height:90px;resize:vertical}.modalactions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#e6f8ed;color:#123b27;padding:12px 17px;border-radius:12px;font-weight:750;box-shadow:0 8px 30px #0005;display:none;z-index:30}
.mobilebar{display:none}
@media(max-width:800px){.app{grid-template-columns:1fr}.sidebar{display:none}.topbar{height:65px;padding:0 17px}.content{padding:22px 16px 95px}.search{width:140px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:22px}.roomgrid{grid-template-columns:1fr}.quick{grid-template-columns:1fr}.chatlayout{grid-template-columns:1fr;min-height:0}.chatlist{border-right:0;border-bottom:1px solid var(--line)}.chatlist .chatrow{display:none}.chatlist .chatrow:first-of-type{display:flex}.chatlist.expanded .chatrow{display:flex}.messages{min-height:260px}.mobilebar{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:space-around;padding:9px 5px calc(9px + env(safe-area-inset-bottom));background:#10151af5;border-top:1px solid var(--line);backdrop-filter:blur(12px)}.mobilebar button{border:0;background:transparent;color:#8995a0;font-size:10px;display:grid;gap:4px;justify-items:center;min-width:52px}.mobilebar button span{font-size:19px}.mobilebar button.active{color:var(--gold)}.datepill{display:none}.welcome{margin-bottom:19px}.pagehead h1{font-size:25px}}
@media(max-width:390px){.stats{grid-template-columns:1fr}.stat{display:flex;align-items:center;gap:12px}.stat strong{margin:0 0 0 auto}.stat small{display:none}.topbar .crumb{display:none}.search{width:170px}.top-actions .iconbtn{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo">✦</div><div><strong>Campus Connect</strong><small>Your campus, connected.</small></div></div>
  <div class="navlabel">WORKSPACE</div>
  <nav class="nav" id="sideNav">
    <button class="active" data-page="home"><span class="ico">⌂</span> Overview</button>
    <button data-page="rooms"><span class="ico">▦</span> Campus rooms</button>
    <button data-page="chats"><span class="ico">◌</span> Private chats <span class="count" id="unreadCount">2</span></button>
    <button data-page="people"><span class="ico">♧</span> People</button>
    <button data-page="files"><span class="ico">▤</span> Files & notes</button>
  </nav>
  <div class="navlabel">CAMPUS LIFE</div>
  <nav class="nav">
    <button data-page="market"><span class="ico">◇</span> Marketplace</button>
    <button data-page="events"><span class="ico">▣</span> Events</button>
  </nav>
  <div class="profilebox"><div class="avatar gold">T</div><div><strong style="font-size:13px">Tristan</strong><small>Student account · Demo</small></div><button title="Profile" onclick="toast('Demo profile settings')">⋯</button></div>
</aside>
<main class="main">
<header class="topbar"><div class="crumb">Campus / <strong id="crumb">Overview</strong></div><div class="top-actions"><input id="globalSearch" class="search" placeholder="⌕  Search campus..." aria-label="Search campus"><button class="iconbtn" onclick="openModal('newMessage')" title="New message">＋</button><button class="iconbtn" onclick="toast('You are using demo mode')">?</button></div></header>
<div class="content" id="content"></div>
</main>
</div>
<nav class="mobilebar" id="mobileNav">
<button class="active" data-page="home"><span>⌂</span>Home</button><button data-page="rooms"><span>▦</span>Rooms</button><button data-page="chats"><span>◌</span>Chats</button><button data-page="people"><span>♧</span>People</button><button data-page="files"><span>▤</span>Files</button>
</nav>
<div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
const rooms=[
{id:'general',name:'General',desc:'Campus conversations, questions and introductions.',icon:'💬',color:'#4a3c1d',members:284,posts:18},
{id:'lectures',name:'Lectures & Notes',desc:'Share study notes, ask questions and prepare together.',icon:'📚',color:'#18374b',members:192,posts:12},
{id:'hostels',name:'Hostels & Rent',desc:'Rooms, roommates, rent tips and accommodation.',icon:'🏠',color:'#174734',members:126,posts:8},
{id:'lost',name:'Lost & Found',desc:'Help return lost belongings to their owners.',icon:'🔎',color:'#4a2029',members:73,posts:4},
{id:'sports',name:'Sports & Clubs',desc:'Find teams, student clubs and people with shared interests.',icon:'⚽',color:'#382052',members:98,posts:7},
{id:'jobs',name:'Jobs & Attachments',desc:'Internships, part-time jobs and career opportunities.',icon:'💼',color:'#512d1b',members:145,posts:9}
];
const people=[
{id:'amanda',name:'Amanda N.',course:'Computer Science · Year 2',bio:'Study groups, design and campus volunteering.',initial:'A',color:'pink',online:true},
{id:'brian',name:'Brian K.',course:'Information Technology · Year 3',bio:'Sharing notes and tech opportunities.',initial:'B',color:'blue',online:true},
{id:'sarah',name:'Sarah M.',course:'Business Administration · Year 2',bio:'Campus events and entrepreneurship.',initial:'S',color:'green',online:false},
{id:'daniel',name:'Daniel O.',course:'Software Engineering · Year 1',bio:'Learning to build useful things.',initial:'D',color:'purple',online:true},
{id:'joy',name:'Joy A.',course:'Medicine · Year 3',bio:'Study tips and peer support.',initial:'J',color:'gold',online:false}
];
let chats=[
{id:'c-amanda',person:'amanda',unread:1,messages:[{from:'amanda',text:'Hey! Are you joining the study group tomorrow?',time:'9:42 PM'},{from:'me',text:'Yes, I will be there. What time?',time:'9:44 PM'}]},
{id:'c-brian',person:'brian',unread:1,messages:[{from:'brian',text:'I found some useful lecture notes. Want me to share them?',time:'10:02 PM'}]}
];
let activeChat='c-amanda',page='home',roomFilter='All',toastTimer;
const content=document.getElementById('content');
function avatar(p){return `<div class="avatar ${p.color||''}">${p.initial||p.name?.[0]||'?'}</div>`}
function personBy(id){return people.find(p=>p.id===id)||{id,name:'Campus student',initial:'C',color:'blue',course:'Student',online:false}}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setPage(p){page=p;document.getElementById('crumb').textContent=({home:'Overview',rooms:'Campus rooms',chats:'Private chats',people:'People',files:'Files & notes',market:'Marketplace',events:'Events'})[p]||p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
function render(){
  if(page==='home')renderHome();if(page==='rooms')renderRooms();if(page==='people')renderPeople();if(page==='chats')renderChats();if(page==='files')renderFiles();if(page==='market')renderMarket();if(page==='events')renderEvents();
  document.getElementById('unreadCount').textContent=chats.reduce((n,c)=>n+c.unread,0);
}
function renderHome(){content.innerHTML=`
<div class="welcome"><div><div class="eyebrow">THURSDAY, OCTOBER 15</div><h1>Your campus. Your community.</h1><p>Good evening, Tristan. Here's what's happening around campus.</p></div><div class="datepill">✦ Student community</div></div>
<div class="stats"><div class="stat"><span class="label">Campus rooms</span><strong>06</strong><small>● Active communities</small></div><div class="stat"><span class="label">Students online</span><strong>128</strong><small>● Demo activity</small></div><div class="stat"><span class="label">Your conversations</span><strong>${chats.length.toString().padStart(2,'0')}</strong><small>● Private chats</small></div></div>
<div class="sectionhead"><h2>Explore campus rooms</h2><button class="secondary" onclick="setPage('rooms')">View all ↗</button></div><div class="roomgrid">${rooms.slice(0,4).map(roomCard).join('')}</div>
<div class="sectionhead"><h2>Quick actions</h2><span>Make campus life easier</span></div><div class="quick"><button onclick="setPage('chats')"><span class="qico">✉️</span><b>Message a student</b><small>Start a private conversation</small></button><button onclick="setPage('files')"><span class="qico">📎</span><b>Find study notes</b><small>Browse shared resources</small></button><button onclick="setPage('market')"><span class="qico">🏷️</span><b>Campus marketplace</b><small>Browse student listings</small></button></div>`}
function roomCard(r){return `<div class="room" role="button" tabindex="0" onclick="openRoom('${r.id}')" onkeydown="if(event.key==='Enter')openRoom('${r.id}')"><div class="roomicon" style="background:${r.color}">${r.icon}</div><div style="min-width:0;flex:1"><h3>${r.name}</h3><p>${r.desc}</p><div class="roomfoot"><span class="dot"></span>${r.members} students <span>·</span>${r.posts} new posts</div></div><button aria-label="Open room">›</button></div>`}
function renderRooms(){content.innerHTML=`<div class="pagehead"><div><h1>Campus rooms</h1><p>Find your people, share knowledge, and stay in the loop.</p></div><button class="primary" onclick="openModal('newPost')">＋ New post</button></div><div class="notice">Demo preview: room posts below are sample content. Connect a shared backend to make posts visible to all students.</div><div class="roomgrid">${rooms.map(roomCard).join('')}</div>`}
function openRoom(id){let r=rooms.find(x=>x.id===id);content.innerHTML=`<div class="pagehead"><div><button class="secondary" onclick="setPage('rooms')">← All rooms</button><h1 style="margin-top:17px">${r.icon} ${r.name}</h1><p>${r.desc}</p></div><button class="primary" onclick="openModal('newPost')">＋ New post</button></div><div class="notice">You're viewing a sample room. Posts are local demo content and aren't shared with other users yet.</div><div class="list"><div class="person">${avatar({initial:'M',color:'gold'})}<div class="details"><strong>Welcome to ${r.name}</strong><small>Campus Connect Team · Pinned</small><p style="color:var(--muted);font-size:13px;margin:9px 0 0">Be kind, stay helpful, and keep this space useful for everyone.</p></div></div><div class="person">${avatar(people[1])}<div class="details"><strong>Brian K.</strong><small>Today · Sample post</small><p style="color:var(--muted);font-size:13px;margin:9px 0 0">${r.id==='lectures'?'Anyone have the latest lecture notes? Let’s help each other prepare.':r.id==='hostels'?'Looking for affordable accommodation close to campus. Any recommendations?':r.id==='jobs'?'Sharing a reminder to keep an eye on internship and attachment deadlines.':'Hello everyone! Introduce yourself and tell us what you are interested in.'}</p></div><button class="secondary" onclick="toast('Post saved in demo')">♡</button></div></div>`}
function renderPeople(){content.innerHTML=`<div class="pagehead"><div><h1>People</h1><p>Meet students and start a private conversation.</p></div></div><div class="notice">These are sample student profiles. Add real students through secure authentication when you connect a backend.</div><div class="list">${people.map(p=>`<div class="person">${avatar(p)}<div class="details"><strong>${p.name} ${p.online?'<span style="color:var(--green);font-size:10px">● ONLINE</span>':''}</strong><small>${p.course}</small><small>${p.bio}</small></div><button class="primary" onclick="startChat('${p.id}')">Message</button></div>`).join('')}</div>`}
function renderChats(){const current=chats.find(c=>c.id===activeChat)||chats[0];content.innerHTML=`<div class="pagehead"><div><h1>Private chats</h1><p>One-to-one conversations with your campus community.</p></div><button class="primary" onclick="openModal('newMessage')">＋ New chat</button></div><div class="notice">Prototype mode: messages save in this browser only. Other students won't receive them until a shared backend is connected.</div><div class="chatlayout"><div class="chatlist"><h3>MESSAGES <button style="float:right;border:0;background:none;color:var(--muted)" onclick="document.querySelector('.chatlist').classList.toggle('expanded')">☷</button></h3>${chats.map(c=>{let p=personBy(c.person),last=c.messages[c.messages.length-1];return `<div class="chatrow ${c.id===activeChat?'selected':''}" onclick="selectChat('${c.id}')">${avatar(p)}<div class="details"><strong>${p.name}</strong><small>${safe(last?.text||'Start a conversation')}</small></div>${c.unread?`<span class="count">${c.unread}</span>`:''}</div>`}).join('')}</div><div class="chatpane">${current?chatPane(current):'<div class="empty">Choose a conversation to begin.</div>'}</div></div>`}
function chatPane(c){let p=personBy(c.person);return `<div class="chathead">${avatar(p)}<div class="details"><strong>${p.name}</strong><small>${p.online?'● Online (demo)':'Student'}</small></div><button class="iconbtn" onclick="toast('Safety controls can be connected to your account system')">⋯</button></div><div class="messages" id="messages">${c.messages.length?c.messages.map(m=>`<div class="bubble ${m.from==='me'?'mine':''}">${safe(m.text)}<small>${safe(m.time)}${m.from==='me'?' · Sent':''}</small></div>`).join(''):'<div class="empty"><div class="big">✉</div><strong>Say hello</strong>Start the conversation with ${p.name}.</div>'}</div><form class="composer" onsubmit="sendMessage(event,'${c.id}')"><input id="messageInput" placeholder="Write a message..." autocomplete="off" maxlength="2000" aria-label="Message"><button class="primary" type="submit">Send ↗</button></form>`}
function selectChat(id){activeChat=id;let c=chats.find(x=>x.id===id);if(c)c.unread=0;renderChats();scrollMessages()}
function startChat(pid){let c=chats.find(x=>x.person===pid);if(!c){c={id:'c-'+pid,person:pid,unread:0,messages:[]};chats.unshift(c)}activeChat=c.id;c.unread=0;setPage('chats')}
function sendMessage(e,id){e.preventDefault();const input=document.getElementById('messageInput'),text=input.value.trim();if(!text)return;const c=chats.find(x=>x.id===id);c.messages.push({from:'me',text,time:new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})});renderChats();scrollMessages()}
function scrollMessages(){let m=document.getElementById('messages');if(m)m.scrollTop=m.scrollHeight}
function renderFiles(){const files=[['PDF','Introduction to Programming — lecture 4','Brian K. · 2.4 MB','📕'],['DOC','Research methods study guide','Amanda N. · 840 KB','📄'],['PDF','Business Communication notes','Sarah M. · 1.8 MB','📘'],['LINK','University library resources','Campus Connect Team · Link','🔗']];content.innerHTML=`<div class="pagehead"><div><h1>Files & notes</h1><p>Useful resources shared by the campus community.</p></div><button class="primary" onclick="openModal('upload')">＋ Share resource</button></div><div class="notice">Sample resources only. File uploads and shared downloads require a storage backend.</div><div class="list">${files.map(f=>`<div class="file"><div class="fileicon">${f[3]}</div><div class="details"><strong>${f[1]}</strong><small>${f[2]}</small></div><button class="secondary" onclick="toast('Connect file storage to enable downloads')">↗ View</button></div>`).join('')}</div>`}
function renderMarket(){const items=[['📚','Calculus textbook','UGX 25,000','Good condition · Brian K.'],['🛏️','Roommate wanted near campus','UGX 180,000 / month','Hostel listing · Student verified (demo)'],['🎧','Wireless headphones','UGX 35,000','Used · Amanda N.']];content.innerHTML=`<div class="pagehead"><div><h1>Campus marketplace</h1><p>Buy, sell, share and find student services.</p></div><button class="primary" onclick="openModal('listing')">＋ Create listing</button></div><div class="notice">Listings are sample content. Meet safely in public places and verify items before paying.</div><div class="roomgrid">${items.map(i=>`<div class="room"><div class="roomicon" style="background:#253746">${i[0]}</div><div style="flex:1"><h3>${i[1]}</h3><p>${i[3]}</p><strong style="color:var(--gold)">${i[2]}</strong></div><button onclick="toast('Sign in and messaging will be required for real listings')">›</button></div>`).join('')}</div>`}
function renderEvents(){const events=[['📅','Campus tech meetup','Friday · 3:00 PM','Student Innovation Hub'],['🎓','Study group: exam prep','Saturday · 10:00 AM','Library study room'],['⚽','Inter-faculty football','Sunday · 2:00 PM','University sports ground']];content.innerHTML=`<div class="pagehead"><div><h1>Campus events</h1><p>Discover what's happening and meet people.</p></div><button class="primary" onclick="openModal('event')">＋ Add event</button></div><div class="notice">Sample events shown for the prototype. Confirm details with event organizers.</div><div class="list">${events.map(e=>`<div class="person"><div class="roomicon" style="background:#293448">${e[0]}</div><div class="details"><strong>${e[1]}</strong><small>${e[2]} · ${e[3]}</small></div><button class="secondary" onclick="toast('Added to demo interests')">I'm interested</button></div>`).join('')}</div>`}
function openModal(type){const modal=document.getElementById('modal');let title='',body='',submit='Save';
if(type==='newMessage'){title='Start a private chat';body=`<div class="field"><label>Choose a student</label><select id="modalPerson">${people.map(p=>`<option value="${p.id}">${p.name} — ${p.course}</option>`).join('')}</select></div><div class="field"><label>First message (optional)</label><textarea id="modalText" placeholder="Say hello..."></textarea></div>`;submit='Start chat'}
if(type==='newPost'){title='Create a room post';body=`<div class="field"><label>Room</label><select id="postRoom">${rooms.map(r=>`<option>${r.name}</option>`).join('')}</select></div><div class="field"><label>Post title</label><input id="postTitle" placeholder="What do you want to share?"></div><div class="field"><label>Message</label><textarea id="postText" placeholder="Add useful details..."></textarea></div>`}
if(type==='upload'){title='Share a resource';body=`<div class="field"><label>Resource title</label><input id="resourceTitle" placeholder="e.g. Biology lecture notes"></div><div class="field"><label>Choose a file</label><input id="resourceFile" type="file"></div><p>In this demo, the resource won't upload to other students.</p>`}
if(type==='listing'){title='Create a marketplace listing';body=`<div class="field"><label>Item or service</label><input id="listingTitle" placeholder="What are you offering?"></div><div class="field"><label>Price (UGX)</label><input id="listingPrice" type="number" placeholder="0"></div><div class="field"><label>Description</label><textarea id="listingDesc" placeholder="Condition, location and details"></textarea></div>`}
if(type==='event'){title='Add a campus event';body=`<div class="field"><label>Event name</label><input id="eventTitle" placeholder="Event title"></div><div class="field"><label>Date and time</label><input id="eventDate" type="datetime-local"></div><div class="field"><label>Location</label><input id="eventPlace" placeholder="Campus venue"></div>`}
modal.innerHTML=`<h2>${title}</h2><p>Campus Connect · Prototype</p>${body}<div class="modalactions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="submitModal('${type}')">${submit}</button></div>`;document.getElementById('modalback').classList.add('show')}
function closeModal(){document.getElementById('modalback').classList.remove('show')}
function submitModal(type){if(type==='newMessage'){let id=document.getElementById('modalPerson').value;let text=document.getElementById('modalText').value.trim();startChat(id);if(text){let c=chats.find(x=>x.person===id);c.messages.push({from:'me',text,time:new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})});renderChats()}closeModal();return}
if(type==='newPost'&&!document.getElementById('postTitle').value.trim()){toast('Add a post title first');return}
if(type==='upload'&&!document.getElementById('resourceTitle').value.trim()){toast('Add a resource title first');return}
if(type==='listing'&&!document.getElementById('listingTitle').value.trim()){toast('Add a listing title first');return}
if(type==='event'&&!document.getElementById('eventTitle').value.trim()){toast('Add an event name first');return}
closeModal();toast('Saved in this demo session. Connect a backend to publish it to everyone.')}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',2800)}
document.getElementById('globalSearch').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();if(!q)return;let match=rooms.find(r=>r.name.toLowerCase().includes(q));if(match){setPage('rooms');e.target.blur();toast('Showing campus rooms — open '+match.name)}else{let p=people.find(p=>(p.name+' '+p.course+' '+p.bio).toLowerCase().includes(q));if(p){setPage('people');e.target.blur();toast('Find '+p.name+' in People') }else toast('No matching room or student in this demo') }});
render();
</script>
</body>
</html>
